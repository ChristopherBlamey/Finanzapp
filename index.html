<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Finanzas</title>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--label:#000000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--blue:#007AFF;--green:#248A3D;--green2:#34C759;--red:#FF3B30;--orange:#C93400;
  --bar:rgba(249,249,249,.84);--shadow:0 1px 0 rgba(0,0,0,.02);--scrim:rgba(0,0,0,.28);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--label:#FFFFFF;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);--blue:#0A84FF;--green:#30D158;--green2:#30D158;--red:#FF453A;--orange:#FF9F0A;
  --bar:rgba(22,22,24,.84);--scrim:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--label:#FFFFFF;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);--blue:#0A84FF;--green:#30D158;--green2:#30D158;--red:#FF453A;--orange:#FF9F0A;
  --bar:rgba(22,22,24,.84);--scrim:rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:6px 16px calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.wrap{padding:24px 32px 130px}}

/* Encabezado */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 4px 10px}
.top h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0}
.link{color:var(--blue);font-size:17px;font-weight:500;padding:6px 2px}
.link:disabled{color:var(--label3)}

/* Selector de cuentas */
.scopes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 12px;margin:0 -16px;padding-left:20px;padding-right:20px}
.scopes::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:17px;background:var(--fill);font-size:15px;font-weight:500;white-space:nowrap;color:var(--label)}
.pill .dot{width:8px;height:8px;border-radius:4px}
.pill[aria-pressed="true"]{background:var(--label);color:var(--bg)}

/* Mes */
.monthbar{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px}
.monthbar .m{font-size:20px;font-weight:600;letter-spacing:-.02em}
.chev{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--blue)}
.chev:disabled{color:var(--label3)}
.chev svg{width:12px;height:20px}

/* Segmentado */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.segwrap{margin:0 0 14px}
.caption{font-size:13px;color:var(--label2);padding:6px 6px 0}

/* Tarjetas */
.grid{display:grid;gap:14px}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:20px;align-items:start}.col{display:grid;gap:20px}}
.col{display:grid;gap:14px;min-width:0}
.card{background:var(--card);border-radius:16px;padding:16px;min-width:0}
.card h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 2px}
.card .sub{font-size:14px;color:var(--label2);margin:0 0 12px}
.sec-h{font-size:13px;color:var(--label2);padding:0 16px 6px;margin-top:6px;text-transform:none}

/* Héroe */
.hero{padding:20px 18px 18px}
.hero .lbl{font-size:15px;color:var(--label2);font-weight:500}
.hero .big{font-size:52px;line-height:1.02;font-weight:700;letter-spacing:-.045em;margin:6px 0 8px;font-variant-numeric:tabular-nums}
@media (max-width:380px){.hero .big{font-size:44px}}
.delta{font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px}
.delta.up{color:var(--orange)} .delta.down{color:var(--green)} .delta.flat{color:var(--label2)}
.storage{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;margin:20px 0 14px;background:var(--fill)}
.storage span{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 12px 13px;min-width:0}
.stat .k{font-size:13px;color:var(--label2);font-weight:500}
.stat .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
@media (max-width:560px){.stats{grid-template-columns:1fr;gap:0;background:var(--card);border-radius:16px;overflow:hidden}
.stat{display:flex;align-items:center;justify-content:space-between;border-radius:0;padding:13px 16px;position:relative}
.stat+.stat::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.stat .k{font-size:16px;color:var(--label);font-weight:400}.stat .v{margin:0;font-size:17px}}
.pos{color:var(--green)} .neg{color:var(--red)}

/* Listas agrupadas */
.list{background:var(--card);border-radius:14px;overflow:hidden}
.card .list{margin:0 -16px -16px;border-radius:0 0 16px 16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;width:100%;text-align:left;position:relative}
.row+.row::before,.row+ .row::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--sep)}
button.row:active,.row.tap:active{background:var(--fill)}
.tile{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:17px;line-height:1}
.tile.sm{width:30px;height:30px;font-size:15px;border-radius:7px}
.tile .dots{font-size:12px;letter-spacing:1px;color:#fff;font-weight:700}
.row .main{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .amt{font-size:16px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.row .amt small{display:block;font-size:12px;color:var(--label2);font-weight:400}
.row .amt.in{color:var(--green)} .row .amt.mute{color:var(--label3);text-decoration:line-through}
.prog{height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px}
.chev-r{color:var(--label3);flex:none}

/* Tendencia */
.trend svg{width:100%;height:auto;display:block}
.trend .lg{display:flex;gap:14px;font-size:13px;color:var(--label2);margin-top:6px}
.trend .lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Hormiga */
.ant .big2{font-size:30px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:13px;padding:6px 10px;border-radius:14px;background:var(--fill);color:var(--label);font-weight:500}
.foot{font-size:13px;color:var(--label2);padding:4px 6px 0;line-height:1.45}
.foot button{color:var(--blue);font-size:13px}

/* Movimientos */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;height:38px;padding:0 10px;margin:0 0 12px}
.search svg{width:16px;height:16px;color:var(--label2);flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--label2)}
.filt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.filt .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card)}
.day{font-size:13px;color:var(--label2);font-weight:500;padding:16px 16px 6px}
.day:first-child{padding-top:4px}

/* Vacío */
.empty{text-align:center;padding:40px 22px 34px}
.empty .ic{width:64px;height:64px;border-radius:16px;background:var(--blue);display:grid;place-items:center;margin:0 auto 18px}
.empty h2{font-size:22px;margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
.empty p{color:var(--label2);font-size:15px;margin:0 auto 20px;max-width:34ch;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;width:100%;max-width:420px}
.btn.sec{background:var(--fill);color:var(--blue)}
.btn.danger{background:transparent;color:var(--red);font-weight:500}
.btn:disabled{opacity:.4}
.btns{display:grid;gap:10px;justify-items:center;margin-top:14px}

/* Cargar */
.drop{border:1.5px dashed var(--fill2);border-radius:16px;transition:background .15s}
.drop.over{background:var(--fill)}
.field{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:0 14px;height:48px}
.field input,.field select{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0;height:100%}
.lbl2{font-size:13px;color:var(--label2);margin:14px 4px 6px}
.err{color:var(--red);font-size:14px;margin:10px 4px 0}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;font-size:15px}
.check+.check{border-top:.5px solid var(--sep)}
.check .ok{color:var(--green2);font-weight:700}
.check .warn{color:var(--orange);font-weight:700}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--fill);color:var(--label2);white-space:nowrap}
.catpill{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--label2);margin-top:2px}
.catpill i{width:8px;height:8px;border-radius:50%}
.tog{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;cursor:pointer;transition:background .2s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .2s}
.tog:checked{background:var(--green2)} .tog:checked::after{transform:translateX(20px)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--blue);animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fi .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:14px 14px 0 0;max-height:90vh;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:su .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;transform:translate(-50%,-50%);border-radius:16px;animation:fi .2s ease;max-height:86vh}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
.sheet-h h3{font-size:17px;font-weight:600;margin:0}
.sheet .amtbig{font-size:40px;font-weight:700;letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.sheet .meta{text-align:center;color:var(--label2);font-size:14px;margin-bottom:16px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cats button{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:12px;font-size:11.5px;line-height:1.2;text-align:center;color:var(--label);background:var(--card)}
.cats button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue)}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
textarea.note{width:100%;border:0;border-radius:12px;background:var(--card);padding:12px 14px;min-height:46px;resize:vertical;outline:none;font-size:16px}

/* Barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--label2);padding:2px 0;max-width:110px}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--blue)}
@media (min-width:900px){.tabbar{left:50%;right:auto;bottom:20px;transform:translateX(-50%);width:440px;border-radius:22px;border:.5px solid var(--sep);padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.12)}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--label);color:var(--bg);font-size:15px;font-weight:500;padding:11px 18px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:fi .2s ease;max-width:calc(100% - 40px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabbar" aria-label="Secciones">
<button data-act="tab" data-tab="resumen"><svg viewBox="0 0 28 28" fill="currentColor"><rect x="4" y="14" width="5" height="10" rx="1.6"/><rect x="11.5" y="8" width="5" height="16" rx="1.6"/><rect x="19" y="4" width="5" height="20" rx="1.6"/></svg>Resumen</button>
<button data-act="tab" data-tab="movs"><svg viewBox="0 0 28 28" fill="currentColor"><circle cx="6" cy="7.5" r="2"/><circle cx="6" cy="14" r="2"/><circle cx="6" cy="20.5" r="2"/><rect x="10.5" y="6.3" width="14" height="2.4" rx="1.2"/><rect x="10.5" y="12.8" width="14" height="2.4" rx="1.2"/><rect x="10.5" y="19.3" width="14" height="2.4" rx="1.2"/></svg>Movimientos</button>
<button data-act="tab" data-tab="cargar"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="14" cy="14" r="10.5"/><path d="M14 9v10M9 14h10"/></svg>Cargar</button>
<button data-act="tab" data-tab="ajustes"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="14" cy="14" r="3.4"/><path d="M14 3.5v3M14 21.5v3M24.5 14h-3M6.5 14h-3M21.4 6.6l-2.1 2.1M8.7 19.3l-2.1 2.1M21.4 21.4l-2.1-2.1M8.7 8.7 6.6 6.6"/></svg>Ajustes</button>
</nav>
<div id="sheet"></div>
<input type="file" id="pdfIn" accept="application/pdf,.pdf" hidden>
<input type="file" id="jsonIn" accept="application/json,.json" hidden>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf.worker.min.js"></script>
<script>
try { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js"; } catch (e) {}
/* ===== Lectores de cartolas (compartido por la app y las pruebas) ===== */
const P = (() => {
  const U = s => (s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const num = s => {
    const neg = /-/.test(s);
    const n = parseInt(String(s).replace(/[^\d,]/g, '').split(',')[0] || '0', 10);
    return neg ? -n : n;
  };
  const isAmt = s => /^-?\$?\s?-?\d{1,3}(\.\d{3})*$/.test(s.trim());
  const center = it => it.x + it.w / 2;
  const nearest = (x, cols) => { let best = null, d = 1e9; for (const k in cols) { if (cols[k] == null) continue; const dd = Math.abs(x - cols[k]); if (dd < d) { d = dd; best = k; } } return best; };

  function groupLines(items) {
    const its = items.filter(i => i.str && i.str.trim()).slice().sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    for (const it of its) {
      let L = lines.find(l => Math.abs(l.y - it.y) <= 3);
      if (!L) { L = { y: it.y, items: [] }; lines.push(L); }
      L.items.push(it);
    }
    lines.forEach(l => { l.items.sort((a, b) => a.x - b.x); l.text = l.items.map(i => i.str.trim()).join(' '); });
    lines.sort((a, b) => b.y - a.y);
    return lines;
  }
  const fullText = pages => pages.map(p => p.items.map(i => i.str).join(' ')).join('\n');
  const dmy = s => { const m = s.match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };

  /* ---------- Santander · cuenta corriente / vista ---------- */
  function santanderCC(pages) {
    const out = { bank: 'Santander', kind: 'cc', rows: [], checks: [] };
    let cols = null, dctoX = null, sucRight = null, headerY = null;
    let period = null, summary = null, accountNo = null, typeLabel = 'Cuenta corriente';
    const t = U(fullText(pages));
    if (/CUENTA VISTA|CUENTA RUT|CUENTA LIFE/.test(t)) typeLabel = 'Cuenta vista';
    const raw = [];
    pages.forEach((pg, pi) => {
      const lines = groupLines(pg.items);
      const all = pg.items;
      const f = s => all.find(i => i.str.trim() === s);
      const hC = f('CARGOS'), hA = f('ABONOS'), hD = all.find(i => /^N° ?DCTO$/.test(i.str.trim()));
      const hS = all.find(i => i.str.trim() === 'SALDO' && hC && Math.abs(i.y - hC.y) < 8);
      const hSuc = all.find(i => i.str.trim() === 'SUCURSAL' && hC && Math.abs(i.y - hC.y) < 8);
      if (hC && hA) {
        cols = { out: center(hC), in: center(hA), saldo: hS ? center(hS) : null };
        dctoX = hD ? hD.x : center(hC) - 60; sucRight = hSuc ? hSuc.x + hSuc.w : 100; headerY = Math.min(hC.y, hA.y);
      }

const app = document.getElementById('app'), sheetRoot = document.getElementById('sheet');
function render() {

  app.innerHTML = `<div class="wrap">${v()}</div>`;
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === UI.tab ? 'page' : 'false'));
  renderSheet();
  const pw = document.getElementById('pw'); if (pw) pw.focus();
}
function renderSheet() { sheetRoot.innerHTML = sheetHTML(); }
function go(tab) { UI.tab = tab; if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab); render(); window.scrollTo(0, 0); }

/* ---------- importación ---------- */
const pdfInput = document.getElementById('pdfIn'), jsonInput = document.getElementById('jsonIn');
pdfInput.addEventListener('change', () => { const f = pdfInput.files[0]; pdfInput.value = ''; if (f) startFile(f); });
async function startFile(f) {
  if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { UI.imp = { step: 'error', err: 'El archivo no es un PDF.' }; go('cargar'); return; }
  let buf;
  try { buf = new Uint8Array(await f.arrayBuffer()); }
  catch (e) { UI.imp = { step: 'error', fileName: f.name, err: 'No se pudo leer el archivo desde el teléfono. Si está en iCloud, ábrelo una vez en Archivos para que se descargue y vuelve a intentarlo.', tech: techOf(e) }; go('cargar'); return; }
  UI.imp = { step: 'reading', fileName: f.name, bytes: buf, remember: true };
  go('cargar');
  openPdf();
}
const isPwErr = e => !!e && (e.name === 'PasswordException' || /password/i.test(e.message || ''));
const techOf = e => (e && e.name ? e.name : 'Error') + ': ' + (e && e.message ? e.message : String(e));
function tryOpen(bytes, pw) {
  return pdfjsLib.getDocument({ data: bytes.slice(), password: pw, isEvalSupported: false, disableFontFace: true, useSystemFonts: false, stopAtErrors: false }).promise;
}
function failPdf(e) {
  const I = UI.imp; I.step = 'error';
  I.err = 'El lector no pudo abrir este PDF. Si tiene clave, intenta ingresarla manualmente.';
  I.tech = techOf(e); render();
}
async function openPdf(password) {
  const I = UI.imp;
  if (!window.pdfjsLib) { I.step = 'error'; I.err = 'No se cargó el lector de PDF. Cierra la app por completo y vuelve a abrirla con conexión.'; I.tech = 'pdfjsLib no disponible'; render(); return; }
  let doc = null, used = password;
  try { doc = await tryOpen(I.bytes, password); }
  catch (e) {
    if (!isPwErr(e)) { failPdf(e); return; }
    if (password === undefined) {
      for (const k of getKeys()) {
        try { doc = await tryOpen(I.bytes, k.pw); used = k.pw; I.savedHit = true; break; }
        catch (e2) { if (!isPwErr(e2)) { failPdf(e2); return; } }
      }
    }
    if (!doc) { I.step = 'password'; I.err = password !== undefined ? 'Clave incorrecta. Inténtalo de nuevo.' : ''; render(); return; }
  }
  try {
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p); const vp = page.getViewport({ scale: 1 }); const tc = await page.getTextContent();
      pages.push({ width: vp.width, items: tc.items.map(i => ({ str: i.str, x: i.transform[4], y: i.transform[5], w: i.width })) });
    }
    try { doc.destroy(); } catch (e) {}
    I.pwUsed = used;
    analyze(pages);
  } catch (e) { failPdf(e); }
}
function analyze(pages) {
  const I = UI.imp; I.bytes = null;
  const res = P.detect(pages);
  if (!res.rows.length) { I.step = 'error'; I.err = 'No encontré movimientos en este PDF. Si es de otro banco, envíaselo a quien mantiene la app para agregar su lector.'; render(); return; }
  if (res.owner) { const parts = res.owner.trim().split(/\s+/); if (parts.length >= 2) { const guess = `${parts[0]} ${parts[1]}`.toLowerCase().replace(/(^|\s)\S/g, s => s.toUpperCase()); if (!D.settings.ownNames.some(n => L.U(n) === L.U(guess))) { D.settings.ownNames.push(guess); save(); } } }
  if (I.pwUsed && I.remember && !I.savedHit) rememberKey(res.kind === 'generic' ? I.fileName : res.accountLabel, I.pwUsed);
  I.pwUsed = null;
  I.res = res; I.step = 'review';
  const exist = res.accountKey ? D.accounts.find(a => a.key === res.accountKey) : null;
  I.accId = exist ? exist.id : (res.kind === 'generic' && D.accounts.length ? D.accounts[0].id : null);
  I.newName = res.kind === 'generic' ? '' : res.accountLabel;
  I.newType = res.accountType || 'cc';
  I.rows = res.rows.map((r, i) => {
    const c = L.clean(r.desc); const k = L.categorize(r.desc, r.dir, D.rules, D.settings.ownNames);
    return Object.assign({}, r, { i, name: c.name, key: c.key, cat: k.cat, type: k.type, sel: true });
  });
  markDups(); render();
}
function targetAccId() { const I = UI.imp; return I.accId || (I.res.accountKey ? 'a-' + I.res.accountKey : 'a-new'); }
function markDups() {
  const I = UI.imp; const ids = L.buildIds(I.rows, targetAccId());
  const have = new Set(D.movements.map(m => m.id));
  I.rows.forEach((r, k) => { r.id = ids[k]; r.dup = have.has(r.id); if (r.dup) r.sel = false; });
}
function impSave() {
  const I = UI.imp, R = I.res;
  let a = acc(I.accId);
  if (!a) {
    const name = (I.newName || '').trim() || R.accountLabel || 'Cuenta';
    a = { id: R.accountKey ? 'a-' + R.accountKey : 'a-' + Date.now().toString(36), name, bank: R.bank, type: R.kind === 'generic' ? I.newType : R.accountType, key: R.accountKey || null, color: PALETTE[D.accounts.length % PALETTE.length] };
    D.accounts.push(a); I.accId = a.id; markDups();
  }
  const stId = a.id + '|' + (R.period ? R.period.from + '_' + R.period.to : (R.statementDate || Date.now()));
  const mesFact = R.kind === 'tc' && R.statementDate ? R.statementDate.slice(0, 7) : null;
  const now = Date.now(); let n = 0;
  I.rows.filter(r => r.sel && !r.dup).forEach(r => {
    const c = L.clean(r.desc);
    D.movements.push({ id: r.id, acc: a.id, date: r.date, mesFact: (a.type === 'tc' ? (mesFact || r.date.slice(0, 7)) : undefined), desc: r.desc, name: r.name, key: r.key, kind: c.kind, amount: r.amount, dir: r.dir, type: r.type, cat: r.cat, tc: r.tc || undefined, stmt: stId, upd: now });
    n++;
  });
  if (!D.statements.find(s => s.id === stId)) D.statements.push({ id: stId, acc: a.id, from: R.period && R.period.from, to: R.period && R.period.to, date: R.statementDate || (R.period && R.period.to) || null, at: now });
  save();
  const mes = mesFact || (R.period ? R.period.to.slice(0, 7) : null);
  UI.imp = null; UI.scope = a.id; UI.mes = mes; UI.fcat = null; UI.ftype = null;
  go('resumen'); toast(`${n} ${n === 1 ? 'movimiento guardado' : 'movimientos guardados'}`);
}

/* ---------- reglas ---------- */
function learn(key, label, cat, type) {
  const def = DEF_TYPE[cat] || null;
  const r = D.rules.find(x => x.key === key);
  const rule = { key, label, cat, type: type && type !== def && !(type === 'gasto' && !def) ? type : (def || type), upd: Date.now() };
  if (r) Object.assign(r, rule); else D.rules.push(rule);
}

/* ---------- respaldo ---------- */
async function exportBackup() {
  const d = new Date(); const fname = `finanzas-respaldo-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
  const data = JSON.stringify(D);
  if (DL) {
    try { await DL.save({ filename: fname, data }); toast('Respaldo exportado'); return; }
    catch (e) { if (e && (e.code === 'declined')) { toast('Exportación cancelada'); return; } if (e && e.code === 'rate_limited') { toast('Espera un momento e inténtalo de nuevo'); return; } }
  }
  try {
    const file = new File([data], fname, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Respaldo de Finanzas' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { const u = URL.createObjectURL(new Blob([data], { type: 'application/json' })); const a = document.createElement('a'); a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); toast('Respaldo exportado'); }
  catch (e) { toast('Este navegador no permite exportar archivos'); }
}
jsonInput.addEventListener('change', async () => {
  const f = jsonInput.files[0]; jsonInput.value = ''; if (!f) return;
  try {
    const X = JSON.parse(await f.text());
    if (!X || !Array.isArray(X.movements) || !Array.isArray(X.accounts)) throw 0;
    let nm = 0;
    X.accounts.forEach(a => { if (!acc(a.id)) D.accounts.push(a); });
    const idx = new Map(D.movements.map((m, i) => [m.id, i]));
    X.movements.forEach(m => { const i = idx.get(m.id); if (i == null) { D.movements.push(m); nm++; } else if ((m.upd || 0) > (D.movements[i].upd || 0)) D.movements[i] = m; });
    (X.rules || []).forEach(r => { const e = D.rules.find(x => x.key === r.key); if (!e) D.rules.push(r); else if ((r.upd || 0) > (e.upd || 0)) Object.assign(e, r); });
    (X.statements || []).forEach(s => { if (!D.statements.find(x => x.id === s.id)) D.statements.push(s); });
    ((X.settings && X.settings.ownNames) || []).forEach(n => { if (!D.settings.ownNames.some(x => L.U(x) === L.U(n))) D.settings.ownNames.push(n); });
    save(); render(); toast(`Respaldo importado · ${nm} ${nm === 1 ? 'movimiento nuevo' : 'movimientos nuevos'}`);
  } catch (e) { toast('Ese archivo no es un respaldo de esta app'); }
});

/* ---------- eventos ---------- */
const A = {
  tab: el => go(el.dataset.tab),
  scope: el => { UI.scope = el.dataset.id; UI.mes = null; UI.fcat = null; UI.ftype = null; render(); },
  mes: el => { const ms = monthsOf(eff()); const i = ms.indexOf(UI.mes) + +el.dataset.d; if (ms[i]) { UI.mes = ms[i]; render(); } },
  setmes: el => { UI.mes = el.dataset.m; render(); },
  tcmode: el => { D.settings.tcMode = el.dataset.v; save(); render(); },
  gocat: el => { UI.fcat = el.dataset.cat; UI.ftype = null; UI.q = ''; go('movs'); },
  gointerno: () => { UI.fcat = null; UI.ftype = 'interno'; UI.q = ''; go('movs'); },
  goant: () => { UI.fcat = null; UI.ftype = 'hormiga'; UI.q = ''; go('movs'); },
  clrf: el => { if (el.dataset.f === 'cat') UI.fcat = null; else UI.ftype = null; render(); },
  pick: () => pdfInput.click(),
  askpw: () => { UI.imp.step = 'password'; UI.imp.err = ''; render(); },
  rmkey: el => { const k = getKeys(); k.splice(+el.dataset.i, 1); setKeys(k); render(); toast('Clave eliminada'); },
  impcancel: () => { UI.imp = null; render(); },
  newtype: el => { UI.imp.newType = el.dataset.v; render(); },
  impsave: () => impSave(),
  edit: el => { const m = D.movements.find(x => x.id === el.dataset.id); if (!m) return; UI.sheet = { kind: 'edit', src: 'mov', id: m.id, draft: { cat: m.cat, type: m.type, note: m.note || '', all: true } }; renderSheet(); },
  editimp: el => { const r = UI.imp.rows.find(x => x.i === +el.dataset.i); UI.sheet = { kind: 'edit', src: 'imp', i: r.i, draft: { cat: r.cat, type: r.type, all: true } }; renderSheet(); },
  dcat: el => { const d = UI.sheet.draft; d.cat = el.dataset.v; d.type = DEF_TYPE[d.cat] || 'gasto'; renderSheet(); },
  dtype: el => { const d = UI.sheet.draft; d.type = el.dataset.v; if (d.type === 'interno') d.cat = 'interno'; else if (d.type === 'ahorro') d.cat = 'ahorro'; else if (d.type === 'ingreso' && !['sueldo','ingresos'].includes(d.cat)) d.cat = 'ingresos'; else if (d.type === 'gasto' && ['sueldo','ingresos','ahorro','interno'].includes(d.cat)) d.cat = 'otros'; renderSheet(); },
  savedit: () => saveEdit(),
  delmov: () => { const id = UI.sheet.id; UI.sheet = { kind: 'confirm', title: 'Eliminar movimiento', text: 'Se quitará de tus resúmenes. Si vuelves a cargar la misma cartola, volverá a aparecer.', ok: 'Eliminar', run: () => { D.movements = D.movements.filter(m => m.id !== id); save(); } }; renderSheet(); },
  close: () => { UI.sheet = null; renderSheet(); },
  confirmok: () => { const f = UI.sheet.run; UI.sheet = null; f(); render(); },
  accsheet: el => { const a = acc(el.dataset.id); UI.sheet = { kind: 'acc', id: a.id, color: a.color }; renderSheet(); },
  acccolor: el => { UI.sheet.color = el.dataset.c; const v = document.getElementById('accName').value; renderSheet(); document.getElementById('accName').value = v; },
  saveacc: () => { const a = acc(UI.sheet.id); const v = document.getElementById('accName').value.trim(); if (v) a.name = v; a.color = UI.sheet.color; save(); UI.sheet = null; render(); },
  delacc: () => { const id = UI.sheet.id; const a = acc(id); UI.sheet = { kind: 'confirm', title: `Eliminar ${a.name}`, text: 'Se borrarán la cuenta y todos sus movimientos de este equipo.', ok: 'Eliminar', run: () => { D.accounts = D.accounts.filter(x => x.id !== id); D.movements = D.movements.filter(m => m.acc !== id); D.statements = D.statements.filter(s => s.acc !== id); if (UI.scope === id) UI.scope = 'all'; save(); } }; renderSheet(); },
  addacc: () => { UI.sheet = { kind: 'addacc', type: 'cc' }; renderSheet(); },
  natype: el => { const v = document.getElementById('naName').value; UI.sheet.type = el.dataset.v; renderSheet(); document.getElementById('naName').value = v; },
  createacc: () => { const v = document.getElementById('naName').value.trim(); if (!v) { document.getElementById('naName').focus(); return; } D.accounts.push({ id: 'a-' + Date.now().toString(36), name: v, bank: '', type: UI.sheet.type, key: null, color: PALETTE[D.accounts.length % PALETTE.length] }); save(); UI.sheet = null; render(); },
  rmown: el => { D.settings.ownNames.splice(+el.dataset.i, 1); save(); recat(); render(); },
  rmrule: el => { D.rules = D.rules.filter(r => r.key !== el.dataset.k); save(); render(); toast('Regla quitada'); },
  export: () => exportBackup(),
  import: () => jsonInput.click(),
  wipe: () => { UI.sheet = { kind: 'confirm', title: 'Borrar todos los datos', text: 'Se eliminarán cuentas, movimientos, reglas y claves guardadas de este equipo. No se puede deshacer.', ok: 'Borrar todo', run: () => { D = blank(); save(); setKeys([]); UI.scope = 'all'; UI.mes = null; } }; renderSheet(); },
};
function saveEdit() {
  const S = UI.sheet, d = S.draft;
  if (S.src === 'imp') {
    const r = UI.imp.rows.find(x => x.i === S.i); r.cat = d.cat; r.type = d.type;
    if (d.all) { UI.imp.rows.forEach(x => { if (x.key === r.key) { x.cat = d.cat; x.type = d.type; } }); learn(r.key, r.name, d.cat, d.type); D.movements.forEach(m => { if (m.key === r.key) { m.cat = d.cat; m.type = d.type; m.upd = Date.now(); } }); save(); }
  } else {
    const m = D.movements.find(x => x.id === S.id); m.cat = d.cat; m.type = d.type; m.note = d.note; m.upd = Date.now();
    if (d.all) { D.movements.forEach(x => { if (x.key === m.key) { x.cat = d.cat; x.type = d.type; x.upd = Date.now(); } }); learn(m.key, m.name, d.cat, d.type); }
    save();
  }
  UI.sheet = null; render(); toast(d.all ? 'Guardado y recordado' : 'Guardado');
}
function recat() { /* al cambiar tus nombres, recalcula solo los movimientos que no tienen regla del usuario */
  D.movements.forEach(m => { if (D.rules.some(r => r.key === m.key)) return; if (!/^TRANSF/i.test(m.desc)) return; const k = L.categorize(m.desc, m.dir, D.rules, D.settings.ownNames); m.cat = k.cat; m.type = k.type; });
  if (UI.imp && UI.imp.rows) UI.imp.rows.forEach(r => { const k = L.categorize(r.desc, r.dir, D.rules, D.settings.ownNames); r.cat = k.cat; r.type = k.type; });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'pw') { const v = document.getElementById('pw').value; if (!v) return; UI.imp.step = 'reading'; UI.imp.err = ''; render(); openPdf(v); }
  if (f === 'own') { const inp = document.getElementById('ownIn'); const v = inp.value.trim(); if (v && !D.settings.ownNames.some(n => L.U(n) === L.U(v))) { D.settings.ownNames.push(v); save(); recat(); render(); toast('Nombre agregado'); } }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { UI.q = t.value; const box = document.getElementById('movlist'); if (box) box.innerHTML = movListHTML(); return; }
  const k = t.dataset.in; if (!k) return;
  if (k === 'newname') UI.imp.newName = t.value;
  if (k === 'dnote') UI.sheet.draft.note = t.value;
  if (k === 'hormiga') { const v = parseInt(t.value.replace(/\D/g, '') || '0', 10); D.settings.hormiga = v || 10000; save(); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.in; if (!k) return;
  if (k === 'sel') { const r = UI.imp.rows.find(x => x.i === +t.dataset.i); r.sel = t.checked; render(); }
  if (k === 'dall') UI.sheet.draft.all = t.checked;
  if (k === 'remember') UI.imp.remember = t.checked;
  if (k === 'accsel') { UI.imp.accId = t.value === '__new' ? null : t.value; markDups(); render(); }
  if (k === 'hormiga') { t.value = miles(D.settings.hormiga); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) { UI.sheet = null; renderSheet(); } });
// arrastrar y soltar en escritorio
document.addEventListener('dragover', e => { if (UI.tab !== 'cargar') return; e.preventDefault(); const d = document.getElementById('drop'); if (d) d.classList.add('over'); });
document.addEventListener('dragleave', e => { const d = document.getElementById('drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => { if (UI.tab !== 'cargar') return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) startFile(f); });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (['resumen', 'movs', 'cargar', 'ajustes'].includes(t) && t !== UI.tab) { UI.tab = t; render(); } });

const h0 = location.hash.slice(1);
if (['resumen', 'movs', 'cargar', 'ajustes'].includes(h0)) UI.tab = h0;
render();
window.__fin = { D: () => D, UI, startBytes: (name, bytes) => { UI.imp = { step: 'reading', fileName: name, bytes }; go('cargar'); return openPdf(); }, pw: v => openPdf(v) };
})();
